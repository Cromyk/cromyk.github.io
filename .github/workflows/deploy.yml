name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; se chegar um push novo, o anterior é descartado.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Os 151 modelos não estão no repositório: o prebuild baixa do
      # Pokemon-3D-api. São 54 MB, então guardamos entre publicações — a
      # chave é o manifesto, que só muda quando o elenco muda.
      - uses: actions/cache@v4
        with:
          path: public/pokemon
          key: modelos-${{ hashFiles('public/pokemon/manifesto.json') }}

      # Os gritos oficiais dos 151, do repositório de áudio da PokeAPI. São só
      # 2 MB, mas são 151 requisições — guardar evita bater no GitHub a cada
      # publicação. A chave é fixa porque o elenco não muda.
      - uses: actions/cache@v4
        with:
          path: public/gritos
          key: gritos-gen1-v1

      # `prebuild` gera os ícones, copia o Draco, baixa o que faltar de modelo
      # e os gritos que ainda não estiverem em cache.

      - run: npm run build

      # Confere que manifest, ícones e service worker chegaram no dist/.
      - run: npm run pwa:check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

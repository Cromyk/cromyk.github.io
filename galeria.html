<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Galeria — Critter Quest</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1b2230; overflow: hidden; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <script type="module">
      // Página só de desenvolvimento: mostra os quatro lado a lado para conferir
      // a silhueta. Não entra no build do jogo.
      import * as THREE from 'three';
      import { ESPECIES } from '/src/species.ts';
      import { Pokemon } from '/src/creature.ts';

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      document.body.appendChild(renderer.domElement);

      const cena = new THREE.Scene();
      cena.background = new THREE.Color(0x1b2230);

      const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 20);
      camera.position.set(0, 0.42, 1.5);
      camera.lookAt(0, 0.2, 0);

      cena.add(new THREE.HemisphereLight(0xffffff, 0x44506a, 1.6));
      const sol = new THREE.DirectionalLight(0xffffff, 2);
      sol.position.set(1.2, 2.4, 1.6);
      sol.castShadow = true;
      sol.shadow.mapSize.set(1024, 1024);
      cena.add(sol);
      const preenche = new THREE.DirectionalLight(0x9fc4ff, 0.7);
      preenche.position.set(-1.5, 0.8, 0.8);
      cena.add(preenche);

      const chao = new THREE.Mesh(
        new THREE.PlaneGeometry(8, 8),
        new THREE.MeshStandardMaterial({ color: 0x2a3346, roughness: 0.9 }),
      );
      chao.rotation.x = -Math.PI / 2;
      chao.receiveShadow = true;
      cena.add(chao);

      const bichos = [];
      const espacamento = 0.42;
      ESPECIES.forEach((especie, i) => {
        const x = (i - (ESPECIES.length - 1) / 2) * espacamento;
        const p = new Pokemon(especie, new THREE.Vector3(x, 0, 0), 0, 'companheiro', i * 77 + 5);
        p.raiz.scale.setScalar(1);
        cena.add(p.raiz);
        bichos.push(p);
      });

      // Deixa passar o "surgindo" e vira todos de frente.
      const jogador = new THREE.Vector3(0, 1.6, 3);
      for (let i = 0; i < 60; i++) for (const p of bichos) p.atualizar(1 / 60, jogador);
      for (const p of bichos) {
        p.raiz.rotation.y = 0;
        p.raiz.scale.setScalar(1);
      }

      let girando = false;
      addEventListener('keydown', (e) => { if (e.code === 'Space') girando = !girando; });

      const relogio = new THREE.Clock();
      renderer.setAnimationLoop(() => {
        const dt = Math.min(0.05, relogio.getDelta());
        for (const p of bichos) {
          p.atualizar(dt, jogador);
          // Trava a posição: aqui eles são bonecos de vitrine, não devem passear.
          p.raiz.position.x = p.ancora.x;
          p.raiz.position.z = p.ancora.z;
          p.raiz.rotation.y = girando ? p.raiz.rotation.y + dt : 0;
        }
        renderer.render(cena, camera);
      });

      window.galeria = { bichos, cena, camera, renderer };
    </script>
  </body>
</html>
